      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <path id="heart" d="M256 412C256 412 96 322 96 204C96 146 140 108 192 108C222 108 245 124 256 146C267 124 290 108 320 108C372 108 416 146 416 204C416 322 256 412 256 412Z"/>
    <clipPath id="inHeart"><use href="#heart"/></clipPath>
